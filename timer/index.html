<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Immunofluorescence Assay Timer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="timer.css" />
</head>
<body>
  <div class="app">
    <header class="top">
      <div>
        <p class="eyebrow">Bench companion</p>
        <h1>Immunofluorescence Assay Timer</h1>
        <p class="tagline">Keep every incubation honest — from methanol fix to secondary antibody.</p>
      </div>
      <div class="clock-card" aria-live="polite">
        <p class="clock-label">Lab clock</p>
        <p id="currentTime" class="clock">--:--:--</p>
      </div>
    </header>

    <main class="steps" id="steps"></main>

    <footer class="foot">
      <a href="../poster/index.html">← Back to poster</a>
      <button type="button" id="resetAll" class="ghost">Reset all steps</button>
    </footer>
  </div>

  <script src="timer.js"></script>
</body>
</html>
